name: E2E Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

        
    - name: Install Playwright Browsers
      run: playwright install --with-deps chromium

    - name: Run Playwright Tests
      run: pytest tests/ --alluredir=allure-results
      continue-on-error: true # Mencegah pipeline langsung mati jika tes gagal

    - name: Run AI Failure Triage
      if: always()
      env:
        GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}
      run: |
        python triage.py
        
        # [BARU] Menampilkan laporan AI langsung di halaman GitHub Actions!
        cat triage_report.md >> $GITHUB_STEP_SUMMARY
        cat AI_USAGE.md >> $GITHUB_STEP_SUMMARY

    - name: Generate Allure Report via Command Line
      run: |
        npm install -g allure-commandline
        allure generate allure-results -o allure-report --clean

    - name: Attach Markdown Files to Report
      if: always()
      run: |
        # Memasukkan file markdown ke dalam folder laporan agar ikut ter-deploy
        cp triage_report.md allure-report/ || true
        cp AI_USAGE.md allure-report/ || true

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report